<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <g font-family="Noto Sans, sans-serif" font-size="16" fill="none" stroke="#333333">
    <!-- text leaves its box -->
    <rect id="small" x="20" y="20" width="80" height="30"/>
    <text id="long" x="25" y="40" fill="#111111" stroke="none">A label far too long</text>
    <!-- two labels on top of each other -->
    <text x="420" y="40" fill="#111111" stroke="none">Overlap one</text>
    <text x="430" y="44" fill="#111111" stroke="none">Overlap two</text>
    <!-- an arrow over box c -->
    <rect id="b" x="20" y="100" width="60" height="40"/>
    <rect id="c" x="120" y="100" width="60" height="40"/>
    <rect id="d" x="220" y="100" width="60" height="40"/>
    <line id="through" x1="80" y1="120" x2="220" y2="120" marker-end="url(#arrow)"/>
    <!-- an arrow that ends in mid-air -->
    <line id="loose" x1="280" y1="120" x2="340" y2="120" marker-end="url(#arrow)"/>
    <!-- three arrow heads on one point -->
    <rect id="e" x="420" y="220" width="80" height="40"/>
    <rect id="f1" x="340" y="140" width="40" height="30"/>
    <rect id="f2" x="440" y="140" width="40" height="30"/>
    <rect id="f3" x="540" y="140" width="40" height="30"/>
    <line x1="360" y1="170" x2="460" y2="220" marker-end="url(#arrow)"/>
    <line x1="460" y1="170" x2="460" y2="220" marker-end="url(#arrow)"/>
    <line x1="560" y1="170" x2="461" y2="220" marker-end="url(#arrow)"/>
  </g>
</svg>
