<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="520" height="220" fill="#ffffff"/>
  <g font-family="Noto Sans, sans-serif" font-size="16" fill="#111111">
    <rect id="input" x="20" y="40" width="140" height="50" fill="#eef2ff" stroke="#334488"/>
    <text x="90" y="70" text-anchor="middle">Input file</text>
    <g transform="translate(190 0)">
      <rect id="parser" x="0" y="40" width="140" height="50" fill="#eef2ff" stroke="#334488"/>
      <text x="70" y="70" text-anchor="middle" font-weight="bold">Parser</text>
    </g>
    <rect id="output" x="360" y="40" width="140" height="50" fill="#eef2ff" stroke="#334488"/>
    <text x="430" y="62" text-anchor="middle">Output<tspan x="430" dy="18" font-size="12">(plain text)</tspan></text>
    <rect id="log" x="190" y="150" width="140" height="50" fill="#fff4e0" stroke="#885522"/>
    <text x="260" y="180" text-anchor="middle">Log &amp; notes</text>
    <line x1="160" y1="65" x2="190" y2="65" stroke="#333333" marker-end="url(#arrow)"/>
    <path d="M330 65 H360" stroke="#333333" marker-end="url(#arrow)"/>
    <polyline points="260,90 260,150" fill="none" stroke="#333333" marker-end="url(#arrow)"/>
  </g>
</svg>
